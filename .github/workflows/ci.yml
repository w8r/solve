name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build @solve/common
        run: npm run build -w @solve/common

      - name: Build @solve/api
        run: npm run build -w @solve/api

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

